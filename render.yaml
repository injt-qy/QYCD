services:
  - type: web
    name: sherlock-tgbot
    runtime: docker
    plan: free

    healthCheckPath: /health

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_IDS
        sync: false

      - key: COOLDOWN
        value: "30"

      - key: MAX_RUNNING
        value: "2"

      - key: WEBHOOK_SECRET
        generateValue: true
